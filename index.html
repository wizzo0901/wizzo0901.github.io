<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comitato Studentesco New Wave</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Tutti gli stili CSS precedenti rimangono invariati */
        /* ... (mantieni tutto il CSS esistente) ... */
        
        /* Aggiungi questi nuovi stili per gli indicatori di stato */
        .connection-status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .connection-status.connected {
            background-color: var(--success);
            color: white;
        }
        
        .connection-status.disconnected {
            background-color: var(--accent);
            color: white;
        }
        
        .connection-status.syncing {
            background-color: var(--warning);
            color: white;
        }
        
        .sync-indicator {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <!-- Aggiungi indicatori di stato della connessione -->
    <div class="connection-status" id="connectionStatus">
        <i class="fas fa-wifi"></i>
        <span>Connessione...</span>
    </div>
    
    <div class="sync-indicator" id="syncIndicator">
        <i class="fas fa-sync fa-spin"></i>
        <span>Sincronizzazione in corso...</span>
    </div>

    <!-- Tutti i modali e il contenuto HTML rimangono invariati -->
    <!-- ... (mantieni tutto l'HTML esistente) ... -->

    <script>
        // Configurazione del backend
        const BACKEND_CONFIG = {
            // URL del server backend - sostituisci con l'URL del tuo server
            baseUrl: 'https://il-tuo-server.com/api',
            // URL del WebSocket server - sostituisci con l'URL del tuo server WebSocket
            wsUrl: 'wss://il-tuo-server.com/ws'
        };

        // Enhanced Security Configuration
        const SECURITY_CONFIG = {
            maxAttempts: 5,
            lockoutTime: 15 * 60 * 1000, // 15 minutes
            sessionTimeout: 60 * 60 * 1000, // 60 minutes
        };

        // Secure credentials storage
        const SECURE_CREDENTIALS = {
            username: "admin",
            password: "NewWave2025!" // Strong password
        };

        // Data storage
        let securityState = {
            loginAttempts: 0,
            lockoutUntil: 0,
            lastActivity: Date.now()
        };

        let isAdmin = false;
        let currentEditingElement = null;
        let currentMediaType = 'none';
        let selectedImage = null;
        let selectedVideo = null;
        let sessionTimer = null;
        
        // Link configuration
        let customLinkConfig = {
            url: "#",
            text: "Link Aggiuntivo"
        };
        
        // Sample data - ora questi saranno sincronizzati dal server
        let news = [];
        let questions = [];
        
        // Variabili per la gestione della connessione
        let socket = null;
        let isConnected = false;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;
        let reconnectTimeout = null;
        
        // DOM Elements
        const loginModal = document.getElementById('loginModal');
        const questionModal = document.getElementById('questionModal');
        const editContentModal = document.getElementById('editContentModal');
        const addNewsModal = document.getElementById('addNewsModal');
        const editLinkModal = document.getElementById('editLinkModal');
        const loginLink = document.getElementById('loginLink');
        const closeLoginModal = document.getElementById('closeLoginModal');
        const closeQuestionModal = document.getElementById('closeQuestionModal');
        const closeEditModal = document.getElementById('closeEditModal');
        const closeAddNewsModal = document.getElementById('closeAddNewsModal');
        const closeLinkModal = document.getElementById('closeLinkModal');
        const loginForm = document.getElementById('loginForm');
        const questionForm = document.getElementById('questionForm');
        const editContentForm = document.getElementById('editContentForm');
        const addNewsForm = document.getElementById('addNewsForm');
        const editLinkForm = document.getElementById('editLinkForm');
        const adminPanel = document.getElementById('adminPanel');
        const askQuestionBtn = document.getElementById('askQuestionBtn');
        const openQuestionModal = document.getElementById('openQuestionModal');
        const askQuestionLink = document.getElementById('askQuestionLink');
        const editHomeBtn = document.getElementById('editHomeBtn');
        const addNewsBtn = document.getElementById('addNewsBtn');
        const viewQuestionsBtn = document.getElementById('viewQuestionsBtn');
        const editLinkBtn = document.getElementById('editLinkBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const adminQuestionsView = document.getElementById('adminQuestionsView');
        const questionsList = document.getElementById('questionsList');
        const newsGrid = document.getElementById('newsGrid');
        const heroTitle = document.getElementById('heroTitle');
        const heroText = document.getElementById('heroText');
        const customLink = document.getElementById('custom-link');
        const customLinkText = document.getElementById('customLinkText');
        const loginAttempts = document.getElementById('loginAttempts');
        const attemptsCount = document.getElementById('attemptsCount');
        const loginButton = document.getElementById('loginButton');
        const connectionStatus = document.getElementById('connectionStatus');
        const syncIndicator = document.getElementById('syncIndicator');
        
        // Media elements
        const mediaTypeBtns = document.querySelectorAll('.media-type-btn');
        const imageUpload = document.getElementById('imageUpload');
        const videoUpload = document.getElementById('videoUpload');
        const newsImage = document.getElementById('newsImage');
        const newsVideo = document.getElementById('newsVideo');
        const imagePreview = document.getElementById('imagePreview');
        const videoPreview = document.getElementById('videoPreview');
        const previewImage = document.getElementById('previewImage');
        const previewVideo = document.getElementById('previewVideo');
        
        // Initialize the page
        function init() {
            setupConnection();
            checkLoginStatus();
            setupEventListeners();
            setupMediaHandlers();
            // I dati verranno caricati dopo la connessione
        }
        
        // Funzioni per la gestione della connessione
        function setupConnection() {
            connectWebSocket();
            
            // Prova a riconnettere se la connessione viene persa
            window.addEventListener('online', function() {
                console.log('Connessione di rete ripristinata');
                connectWebSocket();
            });
            
            window.addEventListener('offline', function() {
                console.log('Connessione di rete persa');
                updateConnectionStatus(false);
            });
        }
        
        function connectWebSocket() {
            try {
                // Se c'è già una connessione, chiudila
                if (socket) {
                    socket.close();
                }
                
                // In una implementazione reale, qui ci sarebbe la connessione al server WebSocket
                // socket = new WebSocket(BACKEND_CONFIG.wsUrl);
                
                // Simuliamo una connessione per questo esempio
                simulateWebSocketConnection();
                
            } catch (error) {
                console.error('Errore nella connessione WebSocket:', error);
                handleConnectionError();
            }
        }
        
        function simulateWebSocketConnection() {
            // Simula una connessione WebSocket
            updateConnectionStatus(true);
            
            // Simula il caricamento dei dati dal server
            setTimeout(() => {
                loadInitialData();
            }, 1000);
            
            // Simula l'invio di aggiornamenti in tempo reale
            setInterval(() => {
                if (isConnected) {
                    // In una implementazione reale, qui riceveremmo aggiornamenti dal server
                    // Per ora, simuliamo solo il mantenimento della connessione
                }
            }, 30000); // Ogni 30 secondi
        }
        
        function handleWebSocketMessage(event) {
            // In una implementazione reale, qui gestiremmo i messaggi dal server
            try {
                const data = JSON.parse(event.data);
                handleServerUpdate(data);
            } catch (error) {
                console.error('Errore nell\'elaborazione del messaggio:', error);
            }
        }
        
        function handleServerUpdate(data) {
            // Gestisci gli aggiornamenti dal server
            switch (data.type) {
                case 'news_update':
                    news = data.payload;
                    renderNews();
                    break;
                case 'questions_update':
                    questions = data.payload;
                    if (isAdmin) {
                        renderQuestions();
                    }
                    break;
                case 'content_update':
                    // Aggiorna il contenuto della home page
                    if (data.payload.heroTitle) {
                        heroTitle.textContent = data.payload.heroTitle;
                    }
                    if (data.payload.heroText) {
                        heroText.textContent = data.payload.heroText;
                    }
                    break;
                case 'link_update':
                    customLinkConfig = data.payload;
                    updateCustomLink();
                    break;
                default:
                    console.log('Tipo di aggiornamento non riconosciuto:', data.type);
            }
        }
        
        function sendToServer(data) {
            // In una implementazione reale, qui invieremmo i dati al server
            if (isConnected) {
                // Simula l'invio al server
                console.log('Invio dati al server:', data);
                
                // In una implementazione reale:
                // socket.send(JSON.stringify(data));
                
                // Per ora, simuliamo una risposta immediata
                simulateServerResponse(data);
            } else {
                console.error('Non connesso al server');
                showSyncIndicator();
                // Salva localmente e tenta di sincronizzare dopo
                saveLocalUpdate(data);
            }
        }
        
        function simulateServerResponse(data) {
            // Simula una risposta dal server
            setTimeout(() => {
                // In una implementazione reale, qui riceveremmo una risposta dal server
                // Per ora, aggiorniamo semplicemente l'interfaccia
                switch (data.type) {
                    case 'add_news':
                        // Il server dovrebbe restituire la notizia con ID
                        const newNews = {
                            id: Date.now(), // ID temporaneo
                            ...data.payload
                        };
                        news.unshift(newNews);
                        renderNews();
                        break;
                    case 'add_question':
                        const newQuestion = {
                            id: Date.now(), // ID temporaneo
                            ...data.payload
                        };
                        questions.push(newQuestion);
                        if (isAdmin) {
                            renderQuestions();
                        }
                        break;
                    case 'delete_news':
                        news = news.filter(n => n.id !== data.payload.id);
                        renderNews();
                        break;
                    case 'delete_question':
                        questions = questions.filter(q => q.id !== data.payload.id);
                        if (isAdmin) {
                            renderQuestions();
                        }
                        break;
                    case 'update_content':
                        if (data.payload.heroTitle) {
                            heroTitle.textContent = data.payload.heroTitle;
                        }
                        if (data.payload.heroText) {
                            heroText.textContent = data.payload.heroText;
                        }
                        break;
                    case 'update_link':
                        customLinkConfig = data.payload;
                        updateCustomLink();
                        break;
                }
            }, 500);
        }
        
        function saveLocalUpdate(data) {
            // Salva l'aggiornamento localmente per sincronizzarlo dopo
            const pendingUpdates = JSON.parse(localStorage.getItem('pendingUpdates') || '[]');
            pendingUpdates.push({
                ...data,
                timestamp: Date.now()
            });
            localStorage.setItem('pendingUpdates', JSON.stringify(pendingUpdates));
        }
        
        function syncPendingUpdates() {
            // Sincronizza gli aggiornamenti pendenti quando la connessione viene ristabilita
            const pendingUpdates = JSON.parse(localStorage.getItem('pendingUpdates') || '[]');
            if (pendingUpdates.length > 0 && isConnected) {
                showSyncIndicator();
                
                pendingUpdates.forEach(update => {
                    sendToServer(update);
                });
                
                // Pulisci gli aggiornamenti pendenti
                localStorage.removeItem('pendingUpdates');
                
                // Nascondi l'indicatore dopo un po'
                setTimeout(() => {
                    hideSyncIndicator();
                }, 2000);
            }
        }
        
        function loadInitialData() {
            // In una implementazione reale, qui caricheremmo i dati iniziali dal server
            // Per ora, usiamo dati di esempio o dal localStorage
            
            // Carica news
            const savedNews = localStorage.getItem('news');
            if (savedNews) {
                news = JSON.parse(savedNews);
            } else {
                // Dati di esempio
                news = [
                    {
                        id: 1,
                        title: "Assemblea Studentesca",
                        date: "2025-10-25",
                        content: "Prossima assemblea studentesca il 25 ottobre. Preparate le vostre proposte e idee da condividere!",
                        mediaType: "none"
                    },
                    {
                        id: 2,
                        title: "Giornata della Sostenibilità",
                        date: "2025-10-10",
                        content: "Stiamo organizzando una giornata dedicata alla sostenibilità. Se sei interessato a partecipare, contattaci!",
                        mediaType: "image",
                        mediaUrl: "https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1000&q=80"
                    }
                ];
            }
            
            // Carica questions
            const savedQuestions = localStorage.getItem('questions');
            if (savedQuestions) {
                questions = JSON.parse(savedQuestions);
            } else {
                questions = [
                    {
                        id: 1,
                        text: "Quando sarà la prossima riunione del comitato?",
                        date: "2025-09-28",
                        expires: "2025-10-28"
                    }
                ];
            }
            
            // Carica custom link
            loadCustomLinkConfig();
            
            // Renderizza i dati
            renderNews();
            updateCustomLink();
            
            // Sincronizza eventuali aggiornamenti pendenti
            syncPendingUpdates();
        }
        
        function updateConnectionStatus(connected) {
            isConnected = connected;
            
            if (connected) {
                connectionStatus.className = 'connection-status connected';
                connectionStatus.innerHTML = '<i class="fas fa-wifi"></i> <span>Connesso</span>';
                reconnectAttempts = 0;
            } else {
                connectionStatus.className = 'connection-status disconnected';
                connectionStatus.innerHTML = '<i class="fas fa-wifi-slash"></i> <span>Disconnesso</span>';
                
                // Prova a riconnettere
                if (reconnectAttempts < maxReconnectAttempts) {
                    reconnectAttempts++;
                    const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000); // Backoff esponenziale
                    
                    reconnectTimeout = setTimeout(() => {
                        connectWebSocket();
                    }, delay);
                }
            }
        }
        
        function showSyncIndicator() {
            syncIndicator.style.display = 'flex';
        }
        
        function hideSyncIndicator() {
            syncIndicator.style.display = 'none';
        }
        
        function handleConnectionError() {
            updateConnectionStatus(false);
            console.error('Errore di connessione al server');
            
            // Mostra un messaggio all'utente
            if (!navigator.onLine) {
                alert('Sei offline. Le modifiche verranno salvate localmente e sincronizzate quando la connessione sarà disponibile.');
            } else {
                alert('Impossibile connettersi al server. Le modifiche verranno salvate localmente e sincronizzate quando la connessione sarà disponibile.');
            }
        }
        
        // Enhanced security functions
        function loadSecurityState() {
            const savedState = localStorage.getItem('securityState');
            if (savedState) {
                try {
                    securityState = JSON.parse(savedState);
                    // Check if lockout period has expired
                    if (securityState.lockoutUntil > 0 && Date.now() > securityState.lockoutUntil) {
                        securityState.loginAttempts = 0;
                        securityState.lockoutUntil = 0;
                        saveSecurityState();
                    }
                } catch (e) {
                    console.error('Error loading security state:', e);
                    securityState = { loginAttempts: 0, lockoutUntil: 0, lastActivity: Date.now() };
                }
            }
        }
        
        function saveSecurityState() {
            localStorage.setItem('securityState', JSON.stringify(securityState));
        }
        
        function updateSecurityUI() {
            const remainingAttempts = SECURITY_CONFIG.maxAttempts - securityState.loginAttempts;
            attemptsCount.textContent = remainingAttempts;
            
            if (securityState.lockoutUntil > 0) {
                const timeLeft = Math.ceil((securityState.lockoutUntil - Date.now()) / 60000);
                loginAttempts.innerHTML = `Account bloccato. Riprova tra ${timeLeft} minuti`;
                loginButton.disabled = true;
                loginButton.innerHTML = '<i class="fas fa-lock"></i> Accesso Bloccato';
            } else if (remainingAttempts <= 0) {
                securityState.lockoutUntil = Date.now() + SECURITY_CONFIG.lockoutTime;
                saveSecurityState();
                updateSecurityUI();
            }
        }
        
        function setupSessionTimer() {
            // Reset session timer on user activity
            document.addEventListener('click', resetSessionTimer);
            document.addEventListener('keypress', resetSessionTimer);
            document.addEventListener('mousemove', resetSessionTimer);
            
            // Check session every minute
            setInterval(checkSession, 60000);
        }
        
        function resetSessionTimer() {
            if (isAdmin) {
                securityState.lastActivity = Date.now();
                saveSecurityState();
            }
        }
        
        function checkSession() {
            if (isAdmin && (Date.now() - securityState.lastActivity) > SECURITY_CONFIG.sessionTimeout) {
                alert('Sessione scaduta per inattività');
                logout();
            }
        }
        
        // Enhanced authentication
        function authenticate(username, password) {
            // Check lockout
            if (securityState.lockoutUntil > 0 && Date.now() < securityState.lockoutUntil) {
                return { success: false, message: `Account bloccato. Riprova tra ${Math.ceil((securityState.lockoutUntil - Date.now()) / 60000)} minuti` };
            }
            
            // Verify credentials
            if (username !== SECURE_CREDENTIALS.username || password !== SECURE_CREDENTIALS.password) {
                securityState.loginAttempts++;
                saveSecurityState();
                updateSecurityUI();
                return { success: false, message: 'Credenziali non valide' };
            }
            
            // Successful login
            securityState.loginAttempts = 0;
            securityState.lockoutUntil = 0;
            securityState.lastActivity = Date.now();
            saveSecurityState();
            
            return { success: true, message: 'Accesso effettuato con successo' };
        }
        
        // Media handlers
        function setupMediaHandlers() {
            // Media type selection
            mediaTypeBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const type = this.getAttribute('data-type');
                    selectMediaType(type);
                });
            });
            
            // Image upload handler
            imageUpload.addEventListener('click', function() {
                newsImage.click();
            });
            
            newsImage.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    // Check file size (5MB max for images)
                    if (file.size > 5 * 1024 * 1024) {
                        alert('L\'immagine è troppo grande. Dimensione massima: 5MB');
                        this.value = '';
                        return;
                    }
                    
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        previewImage.src = e.target.result;
                        imagePreview.style.display = 'block';
                        selectedImage = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });
            
            // Video upload handler
            videoUpload.addEventListener('click', function() {
                newsVideo.click();
            });
            
            newsVideo.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    // Check file size (100MB max for videos)
                    if (file.size > 100 * 1024 * 1024) {
                        alert('Il video è troppo grande. Dimensione massima: 100MB');
                        this.value = '';
                        return;
                    }
                    
                    const url = URL.createObjectURL(file);
                    previewVideo.src = url;
                    videoPreview.style.display = 'block';
                    selectedVideo = url;
                }
            });
        }
        
        // Select media type
        function selectMediaType(type) {
            currentMediaType = type;
            
            // Update button states
            mediaTypeBtns.forEach(btn => {
                if (btn.getAttribute('data-type') === type) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // Show/hide upload sections
            imageUpload.style.display = type === 'image' ? 'block' : 'none';
            videoUpload.style.display = type === 'video' ? 'block' : 'none';
            
            // Reset previews when changing type
            if (type !== 'image') {
                imagePreview.style.display = 'none';
                previewImage.src = '';
                newsImage.value = '';
                selectedImage = null;
            }
            
            if (type !== 'video') {
                videoPreview.style.display = 'none';
                previewVideo.src = '';
                newsVideo.value = '';
                selectedVideo = null;
            }
        }
        
        // Render news items
        function renderNews() {
            newsGrid.innerHTML = '';
            
            if (news.length === 0) {
                newsGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-newspaper"></i>
                        <h3>Nessuna novità al momento</h3>
                        <p>Torna presto per aggiornamenti!</p>
                    </div>
                `;
                return;
            }
            
            // Sort news by date (newest first)
            const sortedNews = [...news].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            sortedNews.forEach(item => {
                const newsItem = document.createElement('div');
                newsItem.className = 'novita-item';
                
                let actionsHTML = '';
                if (isAdmin) {
                    actionsHTML = `
                        <div class="novita-actions">
                            <button class="btn btn-danger" onclick="deleteNews(${item.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    `;
                }
                
                let mediaHTML = '';
                if (item.mediaType === 'image' && item.mediaUrl) {
                    mediaHTML = `
                        <div class="media-container">
                            <img src="${item.mediaUrl}" alt="${item.title}">
                        </div>
                    `;
                } else if (item.mediaType === 'video' && item.mediaUrl) {
                    mediaHTML = `
                        <div class="media-container">
                            <video controls>
                                <source src="${item.mediaUrl}" type="video/mp4">
                                Il tuo browser non supporta la riproduzione di video.
                            </video>
                        </div>
                    `;
                }
                
                newsItem.innerHTML = `
                    ${actionsHTML}
                    <h3>${item.title}</h3>
                    <div class="date">
                        <i class="far fa-calendar"></i> ${formatDate(item.date)}
                    </div>
                    ${mediaHTML}
                    <p>${item.content}</p>
                `;
                newsGrid.appendChild(newsItem);
            });
            
            // Salva localmente per backup
            localStorage.setItem('news', JSON.stringify(news));
        }
        
        // Render questions (admin view)
        function renderQuestions() {
            questionsList.innerHTML = '';
            
            if (questions.length === 0) {
                questionsList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-question-circle"></i>
                        <h3>Nessuna domanda ricevuta</h3>
                        <p>Non ci sono ancora domande da visualizzare.</p>
                    </div>
                `;
                return;
            }
            
            questions.forEach(question => {
                const questionItem = document.createElement('div');
                questionItem.className = 'question-item';
                questionItem.innerHTML = `
                    <div class="question-header">
                        <div>
                            <div class="question-text">${question.text}</div>
                            <div class="question-date">Ricevuta il: ${formatDate(question.date)} - Scade il: ${formatDate(question.expires)}</div>
                        </div>
                        <div class="question-actions">
                            <button class="btn btn-danger" onclick="deleteQuestion(${question.id})">Elimina</button>
                        </div>
                    </div>
                `;
                questionsList.appendChild(questionItem);
            });
            
            // Salva localmente per backup
            localStorage.setItem('questions', JSON.stringify(questions));
        }
        
        // Format date for display
        function formatDate(dateString) {
            const options = { day: '2-digit', month: '2-digit', year: 'numeric' };
            return new Date(dateString).toLocaleDateString('it-IT', options);
        }
        
        // Check if user is logged in
        function checkLoginStatus() {
            const savedLogin = localStorage.getItem('isAdmin');
            if (savedLogin === 'true') {
                isAdmin = true;
                adminPanel.style.display = 'block';
                loginLink.textContent = 'Logout';
                securityState.lastActivity = Date.now();
                saveSecurityState();
            }
        }
        
        // Load custom link configuration
        function loadCustomLinkConfig() {
            const savedConfig = localStorage.getItem('customLinkConfig');
            if (savedConfig) {
                customLinkConfig = JSON.parse(savedConfig);
            }
        }
        
        // Update custom link display
        function updateCustomLink() {
            customLink.href = customLinkConfig.url;
            customLinkText.textContent = customLinkConfig.text;
            
            // Salva localmente per backup
            localStorage.setItem('customLinkConfig', JSON.stringify(customLinkConfig));
        }
        
        // Setup event listeners
        function setupEventListeners() {
            // Menu toggle for mobile
            const menuToggle = document.getElementById('menuToggle');
            const mainNav = document.getElementById('mainNav');
            
            menuToggle.addEventListener('click', function() {
                mainNav.classList.toggle('active');
            });
            
            // Close menu when clicking on a link
            const navLinks = document.querySelectorAll('nav a');
            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    mainNav.classList.remove('active');
                });
            });
            
            // Back to top button
            const backToTop = document.getElementById('backToTop');
            
            window.addEventListener('scroll', function() {
                if (window.pageYOffset > 300) {
                    backToTop.classList.add('visible');
                } else {
                    backToTop.classList.remove('visible');
                }
            });
            
            backToTop.addEventListener('click', function(e) {
                e.preventDefault();
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
            
            // Modal controls
            loginLink.addEventListener('click', function(e) {
                e.preventDefault();
                if (isAdmin) {
                    logout();
                } else {
                    updateSecurityUI();
                    loginModal.classList.add('active');
                }
            });
            
            closeLoginModal.addEventListener('click', function() {
                loginModal.classList.remove('active');
            });
            
            closeQuestionModal.addEventListener('click', function() {
                questionModal.classList.remove('active');
            });
            
            closeEditModal.addEventListener('click', function() {
                editContentModal.classList.remove('active');
            });
            
            closeAddNewsModal.addEventListener('click', function() {
                addNewsModal.classList.remove('active');
                // Reset form
                addNewsForm.reset();
                selectMediaType('none');
            });
            
            closeLinkModal.addEventListener('click', function() {
                editLinkModal.classList.remove('active');
            });
            
            // Open question modal from multiple places
            [askQuestionBtn, openQuestionModal, askQuestionLink].forEach(element => {
                element.addEventListener('click', function(e) {
                    e.preventDefault();
                    questionModal.classList.add('active');
                });
            });
            
            // Form submissions
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                const authResult = authenticate(username, password);
                
                if (authResult.success) {
                    login();
                } else {
                    alert('Errore di autenticazione: ' + authResult.message);
                }
            });
            
            questionForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const questionText = document.getElementById('questionText').value;
                
                if (questionText.trim() === '') {
                    alert('Per favore, inserisci una domanda!');
                    return;
                }
                
                addQuestion(questionText);
                questionForm.reset();
                questionModal.classList.remove('active');
                alert('Domanda inviata con successo!');
            });
            
            editContentForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const title = document.getElementById('contentTitle').value;
                const text = document.getElementById('contentText').value;
                
                if (currentEditingElement === 'heroTitle') {
                    heroTitle.textContent = title;
                    // Invia al server
                    sendToServer({
                        type: 'update_content',
                        payload: {
                            heroTitle: title,
                            heroText: heroText.textContent
                        }
                    });
                } else if (currentEditingElement === 'heroText') {
                    heroText.textContent = text;
                    // Invia al server
                    sendToServer({
                        type: 'update_content',
                        payload: {
                            heroTitle: heroTitle.textContent,
                            heroText: text
                        }
                    });
                }
                
                editContentModal.classList.remove('active');
                alert('Contenuto aggiornato con successo!');
            });
            
            addNewsForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const title = document.getElementById('newsTitle').value;
                const date = document.getElementById('newsDate').value;
                const content = document.getElementById('newsContent').value;
                
                if (!title || !date || !content) {
                    alert('Per favore, compila tutti i campi obbligatori!');
                    return;
                }
                
                let mediaUrl = null;
                if (currentMediaType === 'image' && selectedImage) {
                    mediaUrl = selectedImage;
                } else if (currentMediaType === 'video' && selectedVideo) {
                    mediaUrl = selectedVideo;
                }
                
                addNews(title, date, content, currentMediaType, mediaUrl);
                addNewsForm.reset();
                selectMediaType('none');
                addNewsModal.classList.remove('active');
                alert('Novità aggiunta con successo!');
            });
            
            editLinkForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const url = document.getElementById('linkUrl').value;
                const text = document.getElementById('linkText').value;
                
                if (!url || !text) {
                    alert('Per favore, compila tutti i campi!');
                    return;
                }
                
                customLinkConfig.url = url;
                customLinkConfig.text = text;
                
                // Invia al server
                sendToServer({
                    type: 'update_link',
                    payload: customLinkConfig
                });
                
                updateCustomLink();
                editLinkModal.classList.remove('active');
                alert('Link configurato con successo!');
            });
            
            // Admin buttons
            editHomeBtn.addEventListener('click', function() {
                currentEditingElement = 'heroTitle';
                document.getElementById('contentTitle').value = heroTitle.textContent;
                document.getElementById('contentText').value = heroText.textContent;
                editContentModal.classList.add('active');
            });
            
            addNewsBtn.addEventListener('click', function() {
                // Set today's date as default
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('newsDate').value = today;
                addNewsModal.classList.add('active');
            });
            
            viewQuestionsBtn.addEventListener('click', function() {
                renderQuestions();
                adminQuestionsView.style.display = 'block';
                document.getElementById('domande').scrollIntoView({ behavior: 'smooth' });
            });
            
            editLinkBtn.addEventListener('click', function() {
                document.getElementById('linkUrl').value = customLinkConfig.url;
                document.getElementById('linkText').value = customLinkConfig.text;
                editLinkModal.classList.add('active');
            });
            
            logoutBtn.addEventListener('click', logout);
            
            // Custom link behavior - only for admin
            customLink.addEventListener('click', function(e) {
                if (!isAdmin) {
                    e.preventDefault();
                    alert('Questo link può essere configurato solo dagli amministratori. Effettua il login per accedere a questa funzionalità.');
                    loginModal.classList.add('active');
                }
            });
        }
        
        // Enhanced login function
        function login() {
            isAdmin = true;
            localStorage.setItem('isAdmin', 'true');
            adminPanel.style.display = 'block';
            loginLink.textContent = 'Logout';
            loginModal.classList.remove('active');
            renderNews();
            securityState.lastActivity = Date.now();
            saveSecurityState();
            alert('Accesso effettuato con successo!');
        }
        
        // Enhanced logout function
        function logout() {
            isAdmin = false;
            localStorage.removeItem('isAdmin');
            adminPanel.style.display = 'none';
            adminQuestionsView.style.display = 'none';
            loginLink.textContent = 'Login';
            renderNews();
            securityState.lastActivity = 0;
            saveSecurityState();
            alert('Logout effettuato con successo!');
        }
        
        // Add a new question
        function addQuestion(text) {
            const now = new Date();
            const expires = new Date(now);
            expires.setDate(expires.getDate() + 30);
            
            const newQuestion = {
                id: Date.now(), // ID temporaneo
                text: text,
                date: now.toISOString().split('T')[0],
                expires: expires.toISOString().split('T')[0]
            };
            
            // Invia al server
            sendToServer({
                type: 'add_question',
                payload: newQuestion
            });
            
            // Aggiorna localmente
            questions.push(newQuestion);
            localStorage.setItem('questions', JSON.stringify(questions));
        }
        
        // Add a new news item
        function addNews(title, date, content, mediaType, mediaUrl) {
            const newNews = {
                id: Date.now(), // ID temporaneo
                title: title,
                date: date,
                content: content,
                mediaType: mediaType,
                mediaUrl: mediaUrl
            };
            
            // Invia al server
            sendToServer({
                type: 'add_news',
                payload: newNews
            });
            
            // Aggiorna localmente
            news.unshift(newNews);
            localStorage.setItem('news', JSON.stringify(news));
            
            // Re-render news
            renderNews();
        }
        
        // Delete a question
        function deleteQuestion(id) {
            if (confirm('Sei sicuro di voler eliminare questa domanda?')) {
                // Invia al server
                sendToServer({
                    type: 'delete_question',
                    payload: { id: id }
                });
                
                // Aggiorna localmente
                questions = questions.filter(q => q.id !== id);
                localStorage.setItem('questions', JSON.stringify(questions));
                renderQuestions();
            }
        }
        
        // Delete a news item
        function deleteNews(id) {
            if (confirm('Sei sicuro di voler eliminare questa novità?')) {
                // Invia al server
                sendToServer({
                    type: 'delete_news',
                    payload: { id: id }
                });
                
                // Aggiorna localmente
                news = news.filter(n => n.id !== id);
                localStorage.setItem('news', JSON.stringify(news));
                renderNews();
            }
        }
        
        // Check for expired questions and remove them
        function checkExpiredQuestions() {
            const today = new Date().toISOString().split('T')[0];
            const initialCount = questions.length;
            
            questions = questions.filter(q => q.expires >= today);
            
            if (questions.length < initialCount) {
                localStorage.setItem('questions', JSON.stringify(questions));
                
                // Invia aggiornamento al server
                sendToServer({
                    type: 'questions_update',
                    payload: questions
                });
            }
        }
        
        // Initialize the application
        loadSecurityState();
        updateSecurityUI();
        setupSessionTimer();
        init();
    </script>
</body>
</html>
